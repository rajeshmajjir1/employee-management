<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title th:text="${employee.id == null ? 'Add Employee' : 'Edit Employee'}">Add Employee</title>
    
    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .container {
            width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }
    </style>

</head>

<body>

<!-- Navigation -->
<div th:replace="~{fragments :: navigation}"></div>

<div class="container">

    <h1 th:text="${employee.id == null ? 'Add Employee' : 'Edit Employee'}">
    Add Employee
	</h1>


    <form id="employeeForm"
          th:action="@{/employees/save}"
          th:object="${employee}"
          method="post">
          
          <input type="hidden"
	       id="employeeId"
	       th:field="*{id}">
          

        <!-- First Name -->
        <div class="form-group">

            <label for="firstName">
                First Name *
            </label>

            <input type="text"
                   id="firstName"
                   th:field="*{firstName}">

            <div class="error"
                 th:if="${#fields.hasErrors('firstName')}"
                 th:errors="*{firstName}">
            </div>

        </div>


        <!-- Last Name -->
        <div class="form-group">

            <label for="lastName">
                Last Name *
            </label>

            <input type="text"
                   id="lastName"
                   th:field="*{lastName}">

            <div class="error"
                 th:if="${#fields.hasErrors('lastName')}"
                 th:errors="*{lastName}">
            </div>

        </div>


        <!-- DOB -->
        <div class="form-group">

            <label for="dob">
                Date of Birth *
            </label>

            <input type="date"
		       id="dob"
		       name="dob"
		       th:value="${employee.dob != null ? #temporals.format(employee.dob, 'yyyy-MM-dd') : ''}"
		       th:attr="max=${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}">


            <div class="error"
                 th:if="${#fields.hasErrors('dob')}"
                 th:errors="*{dob}">
            </div>

        </div>


        <!-- Department -->
        <div class="form-group">

		    <label for="department">
		        Department *
		    </label>
		
		    <select id="department"
		            th:field="*{department}">
		
		        <option value="">
		            -- Select Department --
		        </option>
		
		        <option th:each="department : ${departments}"
				        th:value="${department.id}"
				        th:text="${department.name}">
				</option>

		
		    </select>
		
		    <div class="error"
		         th:if="${#fields.hasErrors('department')}"
		         th:errors="*{department}">
		    </div>
		
		</div>


        <!-- Salary -->
        <div class="form-group">

            <label for="salary">
                Salary *
            </label>

            <input type="number"
                   id="salary"
                   step="0.01"
                   th:field="*{salary}">

            <div class="error"
                 th:if="${#fields.hasErrors('salary')}"
                 th:errors="*{salary}">
            </div>

        </div>


        <!-- Manager -->
        <div class="form-group">

            <label for="manager">
                Manager
            </label>

            <select id="manager"
                    th:field="*{manager}">

                <option value="">
                    -- No Manager --
                </option>

                <option th:each="emp : ${employees}"
                        th:value="${emp.id}"
                        th:text="${emp.firstName + ' ' + emp.lastName}">
                </option>

            </select>

        </div>


        <div style="display: flex; gap: 10px;">

		    <button type="submit"
		            th:text="${employee.id == null ? 'Save Employee' : 'Update Employee'}">
		        Save Employee
		    </button>
		
		    <a th:href="@{/employees}"
		       style="
		           display: block;
		           width: 100%;
		           padding: 10px;
		           background-color: #6c757d;
		           color: white;
		           text-align: center;
		           text-decoration: none;
		           border-radius: 4px;
		       ">
		        Cancel
		    </a>
		
		</div>



    </form>

</div>

<script th:src="@{/js/employee-form.js}"></script>

</body>

</html>
