<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>View Employee</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .container {
            width: 600px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .detail {
            display: flex;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .label {
            width: 180px;
            font-weight: bold;
        }

        .value {
            flex: 1;
        }

        .passport-link {
            color: #6f42c1;
            text-decoration: none;
            font-weight: bold;
        }

        .passport-link:hover {
            text-decoration: underline;
        }

        .no-passport {
            color: #999;
            font-style: italic;
        }

        .buttons {
            margin-top: 25px;
            text-align: center;
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            margin: 5px;
            text-decoration: none;
            color: white;
            border-radius: 4px;
        }

        .back {
            background-color: #6c757d;
        }

        .edit {
            background-color: #28a745;
        }

        .passport {
            background-color: #6f42c1;
        }

        .button:hover {
            opacity: 0.9;
        }

    </style>

</head>

<body>

<div th:replace="~{fragments :: navigation}"></div>


<div class="container">

    <h1>Employee Details</h1>


    <!-- Employee ID -->
    <div class="detail">

        <div class="label">
            Employee ID
        </div>

        <div class="value"
             th:text="${employee.id}">
        </div>

    </div>


    <!-- First Name -->
    <div class="detail">

        <div class="label">
            First Name
        </div>

        <div class="value"
             th:text="${employee.firstName}">
        </div>

    </div>


    <!-- Last Name -->
    <div class="detail">

        <div class="label">
            Last Name
        </div>

        <div class="value"
             th:text="${employee.lastName}">
        </div>

    </div>


    <!-- Date of Birth -->
    <div class="detail">

        <div class="label">
            Date of Birth
        </div>

        <div class="value"
             th:text="${employee.dob}">
        </div>

    </div>


    <!-- Department -->
    <div class="detail">

        <div class="label">
            Department
        </div>

        <div class="value"
             th:text="${employee.department != null
                       ? employee.department.name
                       : '-'}">
        </div>

    </div>


    <!-- Salary -->
    <div class="detail">

        <div class="label">
            Salary
        </div>

        <div class="value"
             th:text="${employee.salary}">
        </div>

    </div>


    <!-- Manager -->
    <div class="detail">

        <div class="label">
            Manager
        </div>

        <div class="value"
             th:text="${employee.manager != null
                       ? employee.manager.firstName + ' '
                         + employee.manager.lastName
                       : '-'}">
        </div>

    </div>


    <!-- Passport -->
    <div class="detail">

        <div class="label">
            Passport
        </div>

        <div class="value">

            <!-- Passport Uploaded -->
            <div th:if="${employee.passportFileName != null}">

                <div>
                    <span
                        th:text="${employee.passportOriginalFileName}">
                        passport.pdf
                    </span>
                </div>

                <div style="margin-top: 8px;">

                    <a class="passport-link"
                       th:href="@{/employees/passport/{id}(id=${employee.id})}"
                       target="_blank">

                        View Passport

                    </a>

                </div>

            </div>


            <!-- Passport Not Uploaded -->
            <span class="no-passport"
                  th:if="${employee.passportFileName == null}">

                Passport not uploaded

            </span>

        </div>

    </div>


    <!-- Passport Content Type -->
    <div class="detail"
         th:if="${employee.passportContentType != null}">

        <div class="label">
            File Type
        </div>

        <div class="value"
             th:text="${employee.passportContentType}">
            application/pdf
        </div>

    </div>


    <!-- Passport File Size -->
    <div class="detail"
         th:if="${employee.passportFileSize != null}">

        <div class="label">
            File Size
        </div>

        <div class="value"
             th:text="${#numbers.formatDecimal(
                         employee.passportFileSize / 1024.0,
                         1,
                         2
                       ) + ' KB'}">

            100 KB

        </div>

    </div>


    <!-- Passport Uploaded Date -->
    <div class="detail"
         th:if="${employee.passportUploadedAt != null}">

        <div class="label">
            Uploaded At
        </div>

        <div class="value"
             th:text="${#temporals.format(
                         employee.passportUploadedAt,
                         'dd-MM-yyyy HH:mm'
                       )}">

            01-01-2026 10:30

        </div>

    </div>


    <!-- Buttons -->
    <div class="buttons">

        <a class="button back"
           th:href="@{/employees}">

            Back

        </a>


        <a class="button edit"
           th:href="@{/employees/edit/{id}(id=${employee.id})}">

            Edit

        </a>


        <!-- View Passport Button -->
        <a class="button passport"
           th:if="${employee.passportFileName != null}"
           th:href="@{/employees/passport/{id}(id=${employee.id})}"
           target="_blank">

            View Passport

        </a>

    </div>

</div>

</body>

</html>
